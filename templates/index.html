<section class="card control-card">
    <h2>Posicionamiento (Modbus)</h2>

    <div class="action-buttons">
        <button id="btn-ack" class="btn btn-secondary">Acknowledge Faults</button>
        <button id="btn-enable" class="btn btn-secondary">Enable Powerstage</button>
        <button id="btn-ref" class="btn btn-secondary">Referencing</button>
    </div>

    <hr>

    <div class="input-group">
        <label for="target-position">Posición objetivo</label>
        <input type="number" id="target-position" value="100000">
    </div>
    <div class="input-group">
        <label for="target-velocity">Velocidad</label>
        <input type="number" id="target-velocity" value="600000">
    </div>
    <div class="input-group">
        <label>
            <input type="checkbox" id="absolute-checkbox">
            Posición absoluta
        </label>
    </div>
    <button id="btn-move" class="btn btn-primary">Mover a posición</button>
</section>
